# ============================================================
#  FC_CHÔMAGE — Configuration principale
#  Modifiez ce fichier selon votre profil et vos préférences
# ============================================================

# ── Mots-clés de recherche ───────────────────────────────────
mots_cles:

  # Au moins un de ces mots doit apparaître dans le titre ou la description
  principaux:
    - "data scientist"
    - "data science"
    - "statisticien"
    - "statisticienne"
    - "ingénieur de recherche"
    - "ingénieure de recherche"
    - "machine learning"
    - "apprentissage automatique"
    - "data analyst"
    - "analyste de données"
    - "mathématiques appliquées"
    - "modélisation statistique"
    - "analyste quantitatif"
    - "biostatisticien"
    - "NLP"
    - "traitement du langage naturel"
    - "deep learning"
    - "intelligence artificielle"
    - "science des données"
    - "économètre"
    - "actuaire"

  # Les offres contenant ces mots seront IGNORÉES
  exclusions:
    - "10 ans d'expérience"
    - "15 ans d'expérience"
    - "+10 ans"
    - "directeur"


# ── Localisation ────────────────────────────────────────────
localisation:
  ville: "Paris"          # Ville principale de recherche
  rayon_km: 50            # Rayon de recherche en km autour de la ville
  inclure_remote: true    # Inclure les offres en télétravail / remote


# ── Type de contrat ─────────────────────────────────────────
contrat:
  # Commentez (avec #) les types que vous NE souhaitez PAS
  types:
    - "CDI"
    - "CDD"
    - "Stage"
    - "Alternance"
    # - "Freelance"
    # - "Intérim"


# ── Salaire ─────────────────────────────────────────────────
salaire:
  minimum: 30000              # Salaire minimum en € / an (0 = pas de filtre)
  afficher_sans_salaire: true # Afficher les offres qui ne précisent pas le salaire


# ── Paramètres de recherche ─────────────────────────────────
recherche:
  intervalle_minutes: 60      # Fréquence de recherche (en mode --loop)
  max_offres_par_recherche: 30  # Offres max récupérées par plateforme
  jours_en_arriere: 7         # Ignorer les offres plus vieilles que X jours


# ── Plateformes ──────────────────────────────────────────────
plateformes:

  france_travail:
    active: true
    # Obtenez vos clés gratuitement sur https://francetravail.io
    # Sinon laissez vide : la plateforme sera ignorée
    client_id: ""
    client_secret: ""

  indeed:
    active: true   # Pas besoin de clé API

  welcome_jungle:
    active: true   # Pas besoin de clé API


# ── Notifications ────────────────────────────────────────────
notifications:
  discord:
    active: true
    # Comment obtenir votre URL Webhook Discord :
    #  1. Ouvrez votre serveur Discord
    #  2. Paramètres du canal (⚙️) > Intégrations > Webhooks
    #  3. « Nouveau webhook » > Copiez l'URL webhook
    webhook_url: ""   # Collez l'URL ici entre les guillemets
