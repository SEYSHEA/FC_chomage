# ============================================================
#  FC_CHÔMAGE — Configuration principale
#  Modifiez ce fichier selon votre profil et vos préférences
# ============================================================

# ── Mots-clés de recherche ───────────────────────────────────
mots_cles:

  # Tier 1 — Titres de poste exacts correspondant à votre profil
  principaux:
    # Data / ML généraliste
    - "data scientist"
    - "data science"
    - "machine learning engineer"
    - "ML engineer"
    - "AI engineer"
    - "data analyst"

    # Graph Machine Learning (spécialité Orange)
    - "graph machine learning"
    - "graph neural network"
    - "GNN"
    - "graph learning"
    - "analyse de réseaux"
    - "Fraude"

    # Modélisation mathématique & stats (cœur de formation)
    - "modélisation mathématique"
    - "statisticien"
    - "statisticienne"
    - "statistiques appliquées"
    - "modélisation statistique"
    - "mathématiques appliquées"
    - "analyste quantitatif"
    - "analyste quantitative"

    # Recherche & neurosciences (spécialité Dassault)
    - "ingénieur de recherche"
    - "ingénieure de recherche"
    - "neurosciences computationnelles"
    - "neuroimagerie"
    - "modélisation cérébrale"

    # Autres postes pertinents
    - "data analyst"
    - "analyste de données"
    - "biostatisticien"
    - "biostatisticienne"
    - "économètre"
    - "actuaire"
    - "NLP"
    - "traitement du langage naturel"
    - "deep learning"
    - "intelligence artificielle"
    - "séries temporelles"
    - "optimisation mathématique"
    - "recherche opérationnelle"

  # Les offres contenant ces mots seront IGNORÉES
  exclusions:
    - "10 ans d'expérience"
    - "15 ans d'expérience"
    - "+10 ans"
    - "+8 ans"
    - "directeur"
    - "director"
    - "manager confirmé"
    - "chef de département"


# ── Localisation ─────────────────────────────────────────────
localisation:
  inclure_remote: true   # Inclure les offres full-remote (visible partout)

  # Zones géographiques à couvrir
  # Chaque zone est recherchée indépendamment — les doublons sont automatiquement supprimés
  zones:
    # ── Paris & Île-de-France ──────────────────────────────
    - ville: "Paris"
      rayon_km: 50

    # ── Provence-Alpes-Côte d'Azur ────────────────────────
    - ville: "Nice"
      rayon_km: 40        # Couvre Nice, Biot (Dassault), Sophia Antipolis, Antibes

    - ville: "Marseille"
      rayon_km: 40        # Couvre Marseille, Aix-en-Provence

  # ⚙️ Compatibilité (utilisé en dernier recours si un scraper ne supporte pas les zones)
  ville: "Paris"
  rayon_km: 50


# ── Type de contrat ──────────────────────────────────────────
contrat:
  types:
    - "CDI"
    - "CDD"
    - "Stage"
    - "Alternance"
    # - "Freelance"
    # - "Intérim"


# ── Salaire ──────────────────────────────────────────────────
salaire:
  minimum: 0             # Salaire minimum en € / an (0 = pas de filtre)
  afficher_sans_salaire: true # Afficher les offres qui ne précisent pas le salaire


# ── Paramètres de recherche ──────────────────────────────────
recherche:
  intervalle_minutes: 60
  max_offres_par_recherche: 30
  jours_en_arriere: 7


# ── Plateformes ──────────────────────────────────────────────
plateformes:

  france_travail:
    active: true
    client_id: ""
    client_secret: ""

  indeed:
    active: false  # python-jobspy incompatible avec Python 3.13+

  welcome_jungle:
    active: true

  linkedin:
    active: true
    li_at_cookie: ""

  apec:
    active: true

  hellowork:
    active: true


# ── Notifications ─────────────────────────────────────────────
notifications:
  discord:
    active: true
    webhook_url: ""
